<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="Coastal Survey Automation: A tool that turns raw hydrographic survey data into the as-built control sheets used to check that each coastal groyne is built to its design."><title>Coastal Survey Automation: A tool that turns raw hydrographic survey data into the as-built control sheets used to check that each coastal groyne is built to its design.</title><style>.trace{stroke-dasharray:.08 .92;stroke-dashoffset:1;animation:trace 4s linear infinite}.breathe{animation:breathe 3.6s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}.shuttle{animation:shuttle 7s cubic-bezier(.65,0,.35,1) infinite alternate}@keyframes trace{to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shuttle{to{transform:translateY(var(--travel))}}@media (prefers-reduced-motion:reduce){.trace{display:none}.breathe,.spin,.shuttle{animation:none}}</style><rect x="12" y="12" width="582" height="312" rx="20" fill="#f2a900"/><rect x="4" y="4" width="582" height="312" rx="20" fill="#231a10" stroke="#f3ece0" stroke-width="3"/><clipPath id="c"><rect x="4" y="4" width="582" height="60" rx="20"/></clipPath><rect x="4" y="4" width="582" height="12" fill="#e2654e" clip-path="url(#c)"/><line x1="4" y1="16" x2="586" y2="16" stroke="#f3ece0" stroke-width="3"/><g transform="translate(450 160) scale(1.3)" fill="none" stroke="#e2654e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.28"><path d="M26 8L56 29L26 50L56 71L26 92"/><path class="trace" pathLength="1" stroke="#fffaf0" stroke-opacity=".55" style="animation-delay:0.3s" d="M26 8L56 29L26 50L56 71L26 92"/><path d="M44 8L74 29L44 50L74 71L44 92"/><path class="trace" pathLength="1" stroke="#fffaf0" stroke-opacity=".55" style="animation-delay:0.65s" d="M44 8L74 29L44 50L74 71L44 92"/><path d="