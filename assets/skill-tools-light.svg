<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Tooling &amp; AI"><title>Tooling &amp; AI</title><style>.trace{stroke-dasharray:.08 .92;stroke-dashoffset:1;animation:trace 4s linear infinite}.breathe{animation:breathe 3.6s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}.shuttle{animation:shuttle 7s cubic-bezier(.65,0,.35,1) infinite alternate}@keyframes trace{to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shuttle{to{transform:translateY(var(--travel))}}@media (prefers-reduced-motion:reduce){.trace{display:none}.breathe,.spin,.shuttle{animation:none}}</style><rect x="2" y="2" width="36" height="36" rx="9" fill="#fbf1dc" stroke="#231a10" stroke-width="2"/><g transform="translate(8 8) scale(1)" fill="none" stroke="#7d3c6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13c0-4 3-7 7-7h3c4 0 6 3 6 7v7h-3v-4h-2v4h-3v-4h-2v4H7v-5c-1.5 0-2.5 1.5-2.5 3.5M15 10h.01"/></g></svg>
