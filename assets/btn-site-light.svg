<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 68" width="202" height="68" role="img" aria-label="birewa.com"><title>birewa.com</title><style>.trace{stroke-dasharray:.08 .92;stroke-dashoffset:1;animation:trace 4s linear infinite}.breathe{animation:breathe 3.6s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}.shuttle{animation:shuttle 7s cubic-bezier(.65,0,.35,1) infinite alternate}@keyframes trace{to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shuttle{to{transform:translateY(var(--travel))}}@media (prefers-reduced-motion:reduce){.trace{display:none}.breathe,.spin,.shuttle{animation:none}}</style><rect x="7" y="7" width="190" height="56" rx="28" fill="#231a10"/><rect x="2" y="2" width="190" height="56" rx="28" fill="#f2a900" stroke="#231a10" stroke-width="2.5"/><g transform="translate(24 17) scale(1.08)" fill="none" stroke="#231a10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3.2 3 15.8 0 19M12 2.5c-3 3.2-3 15.8 0 19"/></g><text x="62" y="37" font-family="'Hanken Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#231a10">birewa.com</text></svg>
