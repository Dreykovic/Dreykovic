<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 16" width="800" height="16" role="img" aria-label="Coastal Survey Automation skill threads: Documents &amp; reporting, Tooling &amp; AI, Data &amp; automation"><title>Coastal Survey Automation skill threads: Documents &amp; reporting, Tooling &amp; AI, Data &amp; automation</title><style>.trace{stroke-dasharray:.08 .92;stroke-dashoffset:1;animation:trace 4s linear infinite}.breathe{animation:breathe 3.6s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}.shuttle{animation:shuttle 7s cubic-bezier(.65,0,.35,1) infinite alternate}@keyframes trace{to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shuttle{to{transform:translateY(var(--travel))}}@media (prefers-reduced-motion:reduce){.trace{display:none}.breathe,.spin,.shuttle{animation:none}}</style><rect x="1.5" y="3" width="109.3" height="10" rx="5" fill="#e9968a" stroke="#231a10" stroke-width="2"/><rect x="115.8" y="3" width="109.3" height="10" rx="5" fill="#7d3c6b" stroke="#231a10" stroke-width="2"/><rect x="230.1" y="3" width="566.4" height="10" rx="5" fill="#e2654e" stroke="#231a10" stroke-width="2"/></svg>
