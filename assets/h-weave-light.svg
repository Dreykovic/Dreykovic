<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 112" width="1200" height="112" role="img" aria-label="The pattern is the work."><title>The pattern is the work.</title><style>.trace{stroke-dasharray:.08 .92;stroke-dashoffset:1;animation:trace 4s linear infinite}.breathe{animation:breathe 3.6s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}.shuttle{animation:shuttle 7s cubic-bezier(.65,0,.35,1) infinite alternate}@keyframes trace{to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shuttle{to{transform:translateY(var(--travel))}}@media (prefers-reduced-motion:reduce){.trace{display:none}.breathe,.spin,.shuttle{animation:none}}</style><g transform="translate(4 6) scale(0.34)" fill="none" stroke="#b5440f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="1"><path d="M41 50a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path class="trace" pathLength="1" stroke="#fffaf0" stroke-opacity=".55" style="animation-delay:0.1s" d="M41 50a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M50 36C38 28 36 20 40 16C44 12 49 14 50 20C51 14 56 12 60 16C64 20 62 28 50 36Z"/><path class="trace" pathLength="1" stroke="#fffaf0" stroke-opacity=".55" style="animation-delay:0.45s" d="M50 36C38 28 36 20 40 16C44 12 49 14 50 20C51 14 56 12 60 16C64 20 62 28 50 36Z"/><path d="M50 36V41"/><path class="trace" pathLength="1" stroke="#fffaf0" stroke-opacity=".55" style="animation-delay:0.8s" d="M50 36V41"/><path d="M64 50C72 38 80 36 84 40C88 44 86 49 80 50C86 51 88 56 84 60C80 64 72 62 64 50Z"/><path class="trace" pathLength="1" stroke="#fffaf0" stroke-opacity=".55" style="animation-delay:1.15s" d="M64 50C72 38 80 36 84 40C88 44 86 49 80 50C86 51 88 56 84 60C80 64 72 62 64 50Z"/><path d="M64 50H59"/><path class="trace" pathLength="1" stroke="#fffaf0" stroke-opacity=".55" style="animation-delay:1.5s" d="M64 50H59"/><path d="M50 64C62 72 64 80 60 8