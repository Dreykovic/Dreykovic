<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Interface &amp; design"><title>Interface &amp; design</title><style>.trace{stroke-dasharray:.08 .92;stroke-dashoffset:1;animation:trace 4s linear infinite}.breathe{animation:breathe 3.6s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}.shuttle{animation:shuttle 7s cubic-bezier(.65,0,.35,1) infinite alternate}@keyframes trace{to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shuttle{to{transform:translateY(var(--travel))}}@media (prefers-reduced-motion:reduce){.trace{display:none}.breathe,.spin,.shuttle{animation:none}}</style><rect x="2" y="2" width="36" height="36" rx="9" fill="#2e2317" stroke="#f3ece0" stroke-width="2"/><g transform="translate(8 8) scale(1)" fill="none" stroke="#2ec4b6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5q10 6 20 0M5 7l1.5 6 2.5-5M11 8.5l1 6 2.5-6M17 7l1 5.5 2.5-6.5"/></g></svg>
